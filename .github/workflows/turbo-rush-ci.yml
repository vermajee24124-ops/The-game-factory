name: Turbo Rush CI

on:
  push:
    branches: [turbo-rush-v1]
    paths:
      - 'projects/GME-2026-0003/**'
      - '.github/workflows/turbo-rush-ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip curl
      - name: Download Godot
        run: |
          mkdir -p /tmp/godot
          curl -L --fail --retry 3 -o /tmp/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Headless import
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path projects/GME-2026-0003/godot --editor --quit
      - name: Smoke test
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path projects/GME-2026-0003/godot --script res://tests/smoke_test.gd
