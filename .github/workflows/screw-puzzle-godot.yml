name: Screw Puzzle - Godot Validation

on:
  workflow_dispatch:
  push:
    branches:
      - screw-puzzle-3d
    paths:
      - "games/bolt-and-board/**"
      - ".github/workflows/screw-puzzle-godot.yml"

permissions:
  contents: write

jobs:
  godot-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate original texture and audio assets
        run: |
          python -m pip install --disable-pip-version-check pillow numpy
          python games/bolt-and-board/tools/generate_assets.py

      - name: Store generated assets in project branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bolt-and-board/assets/
          if ! git diff --cached --quiet; then
            git commit -m "Add generated Bolt and Board game assets"
            git push
          else
            echo "Generated assets are already current."
          fi

      - name: Download Godot 4.7.2 Stable
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Import project and parse scripts
        working-directory: games/bolt-and-board
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Run headless gameplay tests
        working-directory: games/bolt-and-board
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/headless_tests.gd

      - name: Render screenshot under Xvfb
        working-directory: games/bolt-and-board
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a Godot_v4.7.2-stable_linux.x86_64 --path . --script res://tests/capture_preview.gd

      - name: Create project ZIP for download
        if: success()
        run: |
          cd games/bolt-and-board
          zip -qr "$GITHUB_WORKSPACE/bolt-and-board-godot-project.zip" . -x ".godot/*" "artifacts/*"

      - name: Write validation summary
        if: always()
        run: |
          mkdir -p games/bolt-and-board/artifacts
          printf 'Workflow: Screw Puzzle - Godot Validation\nCommit: %s\nRun: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > games/bolt-and-board/artifacts/ci_validation.txt

      - name: Upload preview, project package and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bolt-and-board-validation
          path: |
            bolt-and-board-godot-project.zip
            games/bolt-and-board/artifacts/
            games/bolt-and-board/docs/TEST_STATUS.md
          if-no-files-found: warn
