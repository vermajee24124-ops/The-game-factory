name: Turbo Rush Release Build
# studio release pipeline 1.7.1 - Unity Ads + Web + no billing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/GME-2026-0003/godot/**'
      - '.github/workflows/turbo-rush-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GODOT_VERSION: "4.7.2"
      GAME_VERSION: "1.7.1"
      VERSION_CODE: "12"
      ANDROID_PLATFORM: "android-36"
      ANDROID_BUILD_TOOLS: "36.1.0"
      ANDROID_CMDLINE_TOOLS: "11076708"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android packages
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "build-tools;36.1.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/aapt2" version
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" version
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/zipalign" -h >/dev/null 2>&1 || true

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          curl -L --fail --retry 3 -o /tmp/godot/godot.zip             "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Build TurboUnityAds Android plugin
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.13/bin/gradle -p android_plugins/turbo_unity_ads clean assembleDebug assembleRelease --no-daemon --stacktrace
          mkdir -p projects/GME-2026-0003/godot/addons/turbo_unity_ads/bin/debug
          mkdir -p projects/GME-2026-0003/godot/addons/turbo_unity_ads/bin/release
          cp android_plugins/turbo_unity_ads/plugin/build/outputs/aar/plugin-debug.aar projects/GME-2026-0003/godot/addons/turbo_unity_ads/bin/debug/TurboUnityAds-debug.aar
          cp android_plugins/turbo_unity_ads/plugin/build/outputs/aar/plugin-release.aar projects/GME-2026-0003/godot/addons/turbo_unity_ads/bin/release/TurboUnityAds-release.aar
          test -s projects/GME-2026-0003/godot/addons/turbo_unity_ads/bin/debug/TurboUnityAds-debug.aar
          test -s projects/GME-2026-0003/godot/addons/turbo_unity_ads/bin/release/TurboUnityAds-release.aar

      - name: Install export templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 -o /tmp/templates.tpz             "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Install project Gradle Android template
        run: |
          set -euo pipefail
          test -f /tmp/templates.tpz
          rm -rf projects/GME-2026-0003/godot/android
          mkdir -p projects/GME-2026-0003/godot/android/build
          unzip -p /tmp/templates.tpz templates/android_source.zip > /tmp/android_source.zip
          test -s /tmp/android_source.zip
          unzip -q /tmp/android_source.zip -d projects/GME-2026-0003/godot/android/build
          test -f projects/GME-2026-0003/godot/android/build/build.gradle
          test -f projects/GME-2026-0003/godot/android/build/gradlew
          printf '%s\n' "4.7.2.stable" > projects/GME-2026-0003/godot/android/.build_version
          test -f projects/GME-2026-0003/godot/android/.build_version

      - name: Fetch pinned CC0 production assets
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/georg-doc/kayfabizarro/378b209355b13304e3cff656ec0806ca5b89df28"
          DEST="projects/GME-2026-0003/godot/assets/studio"
          mkdir -p "$DEST"
          curl -L --fail --retry 3 -o "$DEST/race-future.glb" "$BASE/media/3D_Assets/kenney_car-kit/Models/GLB%20format/race-future.glb"
          curl -L --fail --retry 3 -o "$DEST/sedan-sports.glb" "$BASE/media/3D_Assets/kenney_car-kit/Models/GLB%20format/sedan-sports.glb"
          curl -L --fail --retry 3 -o "$DEST/building-c.glb" "$BASE/media/3D_Assets/kenney_city-kit-commercial_2.1/Models/GLB%20format/building-c.glb"
          curl -L --fail --retry 3 -o "$DEST/building-skyscraper-b.glb" "$BASE/media/3D_Assets/kenney_city-kit-commercial_2.1/Models/GLB%20format/building-skyscraper-b.glb"
          curl -L --fail --retry 3 -o "$DEST/light-square-double.glb" "$BASE/media/3D_Assets/kenney_city-kit-roads/Models/GLB%20format/light-square-double.glb"
          curl -L --fail --retry 3 -o "$DEST/grandStandCovered.glb" "$BASE/media/3D_Assets/kenney_racing-kit/Models/GLTF%20format/grandStandCovered.glb"
          curl -L --fail --retry 3 -o "$DEST/barrierRed.glb" "$BASE/media/3D_Assets/kenney_racing-kit/Models/GLTF%20format/barrierRed.glb"
          mkdir -p "$DEST/Textures"
          curl -L --fail --retry 3 -o "$DEST/Textures/colormap.png" "$BASE/media/3D_Assets/kenney_car-kit/Models/GLB%20format/Textures/colormap.png"
          for f in "$DEST"/*.glb "$DEST/Textures/colormap.png"; do test -s "$f"; done

      - name: Verify project files
        run: |
          set -euo pipefail
          test -f projects/GME-2026-0003/godot/project.godot
          test -f projects/GME-2026-0003/godot/main.tscn
          test -f projects/GME-2026-0003/godot/main.gd
          test -f projects/GME-2026-0003/godot/assets/turbo_rush_logo.svg

      - name: Headless import
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path projects/GME-2026-0003/godot --editor --quit 2>&1 | tee /tmp/turbo-import.log
          if grep -qE 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' /tmp/turbo-import.log; then
            echo "Godot import detected script errors."
            exit 1
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless             --path projects/GME-2026-0003/godot             --script res://tests/smoke_test.gd             2>&1 | tee /tmp/turbo-smoke.log

      - name: Prepare release signing
        id: signing
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/turbo-rush-release.jks"
          GENERATED="false"
          if [ -n "${{ secrets.TURBO_RUSH_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.TURBO_RUSH_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
            KEYSTORE_PASS="${{ secrets.TURBO_RUSH_KEYSTORE_PASSWORD }}"
            KEYSTORE_USER="${{ secrets.TURBO_RUSH_KEYSTORE_ALIAS }}"
            test -n "$KEYSTORE_PASS"
            test -n "$KEYSTORE_USER"
          else
            KEYSTORE_PASS="$(openssl rand -hex 24)"
            KEYSTORE_USER="turbo_rush"
            keytool -genkeypair -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -alias "$KEYSTORE_USER" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Turbo Rush, OU=Verma Game Studios, O=Verma Game Studios, L=India, C=IN"
            GENERATED="true"
          fi
          test -s "$KEYSTORE_PATH"
          echo "::add-mask::$KEYSTORE_PASS"
          echo "::add-mask::$KEYSTORE_USER"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEYSTORE_USER" >> "$GITHUB_ENV"
          echo "generated=$GENERATED" >> "$GITHUB_OUTPUT"
          if [ "$GENERATED" = "true" ]; then
            echo "Temporary signing key generated for this CI artifact; it is not exported." > "$RUNNER_TEMP/signing_note.txt"
          fi

      - name: Android release APK
        run: |
          set -euo pipefail
          mkdir -p projects/GME-2026-0003/artifacts
          "$GODOT_BIN" --headless --path projects/GME-2026-0003/godot --export-release "Android Release APK" ../artifacts/TurboRush-v1.7.1-release.apk 2>&1 | tee /tmp/turbo-export-release-apk.log

      - name: Reset Gradle template before AAB
        run: |
          set -euo pipefail
          rm -rf projects/GME-2026-0003/godot/android
          mkdir -p projects/GME-2026-0003/godot/android/build
          unzip -p /tmp/templates.tpz templates/android_source.zip > /tmp/android_source_aab.zip
          test -s /tmp/android_source_aab.zip
          unzip -q /tmp/android_source_aab.zip -d projects/GME-2026-0003/godot/android/build
          printf '%s\n' "4.7.2.stable" > projects/GME-2026-0003/godot/android/.build_version
          find projects/GME-2026-0003/godot/android -type f -name '*.import' -delete
          test -f projects/GME-2026-0003/godot/android/build/build.gradle

      - name: Android release AAB
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path projects/GME-2026-0003/godot --export-release "Android Release AAB" ../artifacts/TurboRush-v1.7.1-release.aab 2>&1 | tee /tmp/turbo-export-release-aab.log

      - name: Web release export
        run: |
          set -euo pipefail
          mkdir -p projects/GME-2026-0003/artifacts/web
          "$GODOT_BIN" --headless --path projects/GME-2026-0003/godot --export-release "Web" ../artifacts/web/index.html 2>&1 | tee /tmp/turbo-export-web.log
          test -s projects/GME-2026-0003/artifacts/web/index.html
          python3 projects/GME-2026-0003/godot/web/patch_export.py
          test -s projects/GME-2026-0003/artifacts/web/index.html
          grep -q "TurboRushWebAds" projects/GME-2026-0003/artifacts/web/index.html
          grep -q "turbo-banner-top" projects/GME-2026-0003/artifacts/web/index.html
          grep -q "turbo-banner-bottom" projects/GME-2026-0003/artifacts/web/index.html
          (cd projects/GME-2026-0003/artifacts/web && zip -qr ../TurboRush-v1.7.1-web.zip .)

      - name: Validate APK
        run: |
          set -euo pipefail
          APK="projects/GME-2026-0003/artifacts/TurboRush-v1.7.1-release.apk"
          AAB="projects/GME-2026-0003/artifacts/TurboRush-v1.7.1-release.aab"
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/aapt2" dump badging "$APK" | tee projects/GME-2026-0003/artifacts/APK_BADGING.txt
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" verify --verbose "$APK" | tee projects/GME-2026-0003/artifacts/APK_SIGNING.txt
          sha256sum "$APK" | tee projects/GME-2026-0003/artifacts/APK_SHA256.txt
          test -s "$AAB"
          unzip -l "$AAB" | grep -E 'BundleConfig.pb|base/manifest/AndroidManifest.xml' | tee projects/GME-2026-0003/artifacts/AAB_STRUCTURE.txt
          sha256sum "$AAB" | tee projects/GME-2026-0003/artifacts/AAB_SHA256.txt


      - name: Write build evidence
        if: always()
        run: |
          mkdir -p projects/GME-2026-0003/artifacts
          {
            echo "Turbo Rush v1.7.1"
            echo "Godot 4.7.2"
            echo "JDK Temurin 17"
            echo "Android platform 34 + 36"
            echo "Android build-tools 34.0.0 + 36.1.0"
            echo "CodeCraft disabled"
            echo "Branded Android splash configured"
            echo "54 cars / 60 wheels / 54 skins / 48 cards"
            echo "External billing disabled; no Aptoide Connect integration"
            echo "Release APK + release AAB + Web export generated in CI"
            echo "Aptoide Connect removed; in-app purchases removed"
          } > projects/GME-2026-0003/artifacts/BUILD_INFO.txt
          cp /tmp/turbo-import.log projects/GME-2026-0003/artifacts/import.log
          test -f /tmp/turbo-smoke.log && cp /tmp/turbo-smoke.log projects/GME-2026-0003/artifacts/smoke.log || true
          test -f /tmp/turbo-export-release-apk.log && cp /tmp/turbo-export-release-apk.log projects/GME-2026-0003/artifacts/export_release_apk.log || true
          test -f /tmp/turbo-export-release-aab.log && cp /tmp/turbo-export-release-aab.log projects/GME-2026-0003/artifacts/export_release_aab.log || true
          test -f /tmp/turbo-export-web.log && cp /tmp/turbo-export-web.log projects/GME-2026-0003/artifacts/export_web.log || true

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-Rush-v1.7.1-release
          path: |
            projects/GME-2026-0003/artifacts/TurboRush-v1.7.1-release.apk
            projects/GME-2026-0003/artifacts/TurboRush-v1.7.1-release.aab
            projects/GME-2026-0003/artifacts/APK_BADGING.txt
            projects/GME-2026-0003/artifacts/APK_SIGNING.txt
            projects/GME-2026-0003/artifacts/APK_SHA256.txt
            projects/GME-2026-0003/artifacts/AAB_STRUCTURE.txt
            projects/GME-2026-0003/artifacts/AAB_SHA256.txt
            projects/GME-2026-0003/artifacts/BUILD_INFO.txt
            projects/GME-2026-0003/artifacts/import.log
            projects/GME-2026-0003/artifacts/smoke.log
            projects/GME-2026-0003/artifacts/export_release_apk.log
            projects/GME-2026-0003/artifacts/export_release_aab.log
            projects/GME-2026-0003/artifacts/export_web.log
            projects/GME-2026-0003/artifacts/TurboRush-v1.7.1-web.zip
          if-no-files-found: error


