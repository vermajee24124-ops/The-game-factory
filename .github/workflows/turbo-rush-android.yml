name: Turbo Rush Android Build
# release-candidate rebuild 7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/GME-2026-0003/godot/**'
      - '.github/workflows/turbo-rush-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GODOT_VERSION: "4.7.2"
      ANDROID_PLATFORM: "android-36"
      ANDROID_BUILD_TOOLS: "36.1.0"
      ANDROID_CMDLINE_TOOLS: "11076708"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android packages
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "build-tools;36.1.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/aapt2" version
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" version
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/zipalign" -h >/dev/null 2>&1 || true

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          curl -L --fail --retry 3 -o /tmp/godot/godot.zip             "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install export templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 -o /tmp/templates.tpz             "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Verify project files
        run: |
          set -euo pipefail
          test -f projects/GME-2026-0003/godot/project.godot
          test -f projects/GME-2026-0003/godot/main.tscn
          test -f projects/GME-2026-0003/godot/main.gd
          test -f projects/GME-2026-0003/godot/assets/turbo_rush_logo.svg

      - name: Headless import
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless             --path projects/GME-2026-0003/godot             --editor --quit             2>&1 | tee /tmp/turbo-import.log

      - name: Smoke test
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless             --path projects/GME-2026-0003/godot             --script res://tests/smoke_test.gd             2>&1 | tee /tmp/turbo-smoke.log

      - name: Android debug APK
        run: |
          set -euo pipefail
          mkdir -p projects/GME-2026-0003/artifacts
          "$GODOT_BIN" --headless             --path projects/GME-2026-0003/godot             --export-debug "Android Debug APK (Prebuilt)"             ../artifacts/TurboRush-v1.1.0-debug.apk             2>&1 | tee /tmp/turbo-export.log

      - name: Validate APK
        continue-on-error: true
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/aapt2" dump badging projects/GME-2026-0003/artifacts/TurboRush-v1.1.0-debug.apk | tee projects/GME-2026-0003/artifacts/APK_BADGING.txt
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" verify --verbose projects/GME-2026-0003/artifacts/TurboRush-v1.1.0-debug.apk | tee projects/GME-2026-0003/artifacts/APK_SIGNING.txt
          sha256sum projects/GME-2026-0003/artifacts/TurboRush-v1.1.0-debug.apk | tee projects/GME-2026-0003/artifacts/APK_SHA256.txt

      - name: Write build evidence
        if: always()
        run: |
          {
            echo "Turbo Rush v1.1.0"
            echo "Godot 4.7.2"
            echo "JDK Temurin 17"
            echo "Android platform 34 + 36"
            echo "Android build-tools 34.0.0 + 36.1.0"
            echo "CodeCraft disabled"
            echo "Startup logo asset verified"
            echo "54 skins / 48 cards catalog"
            echo "10 Aptoide product IDs configured"
            echo "Debug APK export + signature verification"
          } > projects/GME-2026-0003/artifacts/BUILD_INFO.txt
          cp /tmp/turbo-import.log projects/GME-2026-0003/artifacts/import.log
          cp /tmp/turbo-smoke.log projects/GME-2026-0003/artifacts/smoke.log
          cp /tmp/turbo-export.log projects/GME-2026-0003/artifacts/export.log

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-Rush-v1.1.0-debug-apk
          path: projects/GME-2026-0003/artifacts/
          if-no-files-found: error
