name: Legacy Gemini Video Research (paused)

# Deliberately manual-only. The previous six-hour/matrix workflow could spend
# Gemini video requests during research. Per the factory quota policy, Gemini
# is reserved for the final gameplay video/audio acceptance gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain the new research path
        run: |
          echo "This legacy workflow is paused to protect Gemini daily quotas."
          echo "Use the scheduled Live Research Watch for official-source updates."
          echo "Use Final Gameplay QA only after a full automated playthrough succeeds."
