name: Turbo Rush Live QA (No CodeCraft)

on:
  pull_request:
    branches: [main]
    paths:
      - 'projects/GME-2026-0003/**'
      - 'game_bible/GME-2026-0003/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y unzip curl
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate repository
        run: python -m factory.validate
      - name: Download Godot 4.7.2
        run: |
          mkdir -p /tmp/godot
          curl -L --fail --retry 3             -o /tmp/godot/godot.zip             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Headless import
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64             --headless --path projects/GME-2026-0003/godot --editor --quit
      - name: Smoke tests
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64             --headless --path projects/GME-2026-0003/godot --script res://tests/smoke_test.gd
      - name: Package source artifact
        run: |
          mkdir -p build/turbo-rush
          cp -r projects/GME-2026-0003 build/turbo-rush/
          tar -czf build/turbo-rush-source.tar.gz -C build/turbo-rush GME-2026-0003
      - uses: actions/upload-artifact@v4
        with:
          name: turbo-rush-source
          path: build/turbo-rush-source.tar.gz
