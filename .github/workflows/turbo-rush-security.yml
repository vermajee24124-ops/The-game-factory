name: Turbo Rush Security

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Turbo Rush static security audit
        run: python3 projects/GME-2026-0003/tests/turbo_rush_security_audit.py

      - name: Run monetization audit
        run: python3 projects/GME-2026-0003/tests/turbo_rush_monetization_audit.py

  strix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STRIX_LLM: ${{ secrets.STRIX_LLM }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Strix quick scan when credentials are configured
        run: |
          set -euo pipefail
          if [ -z "$LLM_API_KEY" ] || [ -z "$STRIX_LLM" ]; then
            echo "Strix not executed: STRIX_LLM and LLM_API_KEY repository secrets are not configured."
            exit 0
          fi
          strix -n -t ./ --scan-mode quick --max-budget 10

      - name: Verify Strix completed when a scan ran
        run: |
          set -euo pipefail
          if [ -z "$LLM_API_KEY" ] || [ -z "$STRIX_LLM" ]; then
            exit 0
          fi
          run_json=$(ls -t strix_runs/*/run.json | head -1)
          status=$(jq -r .status "$run_json")
          echo "Strix status: $status"
          test "$status" = "completed"

      - name: Upload Strix SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs