name: AI SuperAgent Evolution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai_superagent/**'
      - 'addons/godot_ai_superagent/**'
      - 'knowledge/**'
      - 'research/**'
      - 'modal/**'
      - '.github/workflows/ai-superagent-evolve.yml'
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: ai-superagent-evolution
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FREELLMAPI_BASE_URL: \${{ secrets.FREELLMAPI_BASE_URL }}
      FREELLMAPI_API_KEY: \${{ secrets.FREELLMAPI_API_KEY }}
      FREELLMAPI_MODEL: \${{ secrets.FREELLMAPI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Agent Reach
        run: |
          python -m pip install --upgrade pip
          python -m pip install "https://github.com/Panniantong/agent-reach/archive/main.zip"
      - name: Health check Agent Reach
        run: |
          agent-reach install --env=auto || true
          agent-reach doctor --json > build_agent_reach_doctor.json || true
          cat build_agent_reach_doctor.json || true
      - name: Collect public YouTube research candidates
        shell: bash
        run: |
          set -e
          mkdir -p build/agent_research/transcripts
          while IFS= read -r query; do
            [ -z "\$query" ] && continue
            url="\$(yt-dlp "ytsearch1:\$query" --flat-playlist --print '%(webpage_url)s' --skip-download | head -n 1 || true)"
            if [ -n "\$url" ]; then
              yt-dlp --skip-download --write-auto-subs --sub-langs 'en.*' --sub-format vtt \
                --output "build/agent_research/transcripts/%(id)s.%(ext)s" "\$url" || true
            fi
          done < research/video_queries.txt
      - name: Summarize research transforms
        run: python research/summarize_research.py
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-research
          path: |
            build/agent_research/
            build_agent_reach_doctor.json

  prepare:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build knowledge manifest
        run: python -m ai_superagent.build_manifest
      - name: Validate Python
        run: python -m compileall -q ai_superagent

  evolve:
    needs: [research, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FREELLMAPI_BASE_URL: \${{ secrets.FREELLMAPI_BASE_URL }}
      FREELLMAPI_API_KEY: \${{ secrets.FREELLMAPI_API_KEY }}
      FREELLMAPI_MODEL: \${{ secrets.FREELLMAPI_MODEL }}
      SUPERAGENT_MAX_TASKS: '20'
      SUPERAGENT_CANDIDATES: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download research artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-research
          path: build/agent_research
      - name: Generate and evaluate tool-use trajectories
        run: python -m ai_superagent.evolve
      - name: Upload evolution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: superagent-evolution
          path: build/ai_superagent/
      - name: Persist regression report
        run: |
          git config user.name "SuperAgent-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/ai_superagent
          git diff --cached --quiet || git commit -m "ai-superagent: update evolution report"
          git push

