name: The Game Factory

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'Optional override/update instruction. Leave empty to use the newest Game Bible in game_bible/inbox.'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'game_bible/**'
      - 'factory/**'
      - 'agents/**'
      - 'projects/**'
      - '.github/workflows/game-factory.yml'

permissions:
  contents: write

concurrency:
  group: game-factory-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate repository
        run: python -m factory.validate

      - name: Verify Godot 4.7.2 knowledge contract
        run: python scripts/verify_godot_knowledge.py

      - name: Check current stable Godot release
        run: python -m factory.cli engine-check

      - name: Inspect Game Bible when present
        shell: bash
        run: |
          bible_count=$(find game_bible/inbox -maxdepth 1 -type f \( -name '*.docx' -o -name '*.md' -o -name '*.txt' \) | wc -l)
          if [ "$bible_count" -gt 0 ]; then
            python -m factory.cli bible-plan
          else
            echo "No active Game Bible in inbox; repository validation continues."
          fi

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security tooling
        run: python -m pip install pip-audit bandit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -r factory main.py -ll

  godot-qa:
    needs: [validate, security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y unzip curl
      - name: Discover Godot projects
        id: projects
        shell: bash
        run: |
          python - <<'PY' > /tmp/godot-projects.txt
          from pathlib import Path
          for path in sorted(Path('projects').glob('GME-*/godot/project.godot')):
              print(path.parent.parent.name)
          PY
          cat /tmp/godot-projects.txt
          test -s /tmp/godot-projects.txt
      - name: Resolve stable engine per project
        shell: bash
        run: |
          while read -r project; do
            version=$(awk '$1 == "version:" {print $2; exit}' "projects/$project/engine.lock")
            test -n "$version"
            echo "$project=$version"
          done < /tmp/godot-projects.txt
      - name: Download required pinned Godot editors
        shell: bash
        run: |
          mkdir -p /tmp/godot
          while read -r project; do
            version=$(awk '$1 == "version:" {print $2; exit}' "projects/$project/engine.lock")
            dir="/tmp/godot/$version"
            if [ ! -x "$dir/Godot_v${version}-stable_linux.x86_64" ]; then
              mkdir -p "$dir"
              curl -L --fail --retry 3 \
                -o "$dir/godot.zip" \
                "https://github.com/godotengine/godot/releases/download/${version}-stable/Godot_v${version}-stable_linux.x86_64.zip"
              unzip -q "$dir/godot.zip" -d "$dir"
              chmod +x "$dir/Godot_v${version}-stable_linux.x86_64"
            fi
          done < /tmp/godot-projects.txt
      - name: Headless import validation for every project
        shell: bash
        run: |
          while read -r project; do
            version=$(awk '$1 == "version:" {print $2; exit}' "projects/$project/engine.lock")
            "/tmp/godot/$version/Godot_v${version}-stable_linux.x86_64" \
              --headless --path "projects/$project/godot" --editor --quit
          done < /tmp/godot-projects.txt
      - name: Run smoke tests when present
        shell: bash
        run: |
          while read -r project; do
            version=$(awk '$1 == "version:" {print $2; exit}' "projects/$project/engine.lock")
            test_file="projects/$project/godot/tests/smoke_test.gd"
            if [ -f "$test_file" ]; then
              "/tmp/godot/$version/Godot_v${version}-stable_linux.x86_64" \
                --headless --path "projects/$project/godot" --script res://tests/smoke_test.gd
            fi
          done < /tmp/godot-projects.txt

  build:
    needs: [validate, security, godot-qa]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve request
        env:
          FACTORY_INSTRUCTION: ${{ inputs.instruction }}
        run: |
          if [ -n "$FACTORY_INSTRUCTION" ]; then
            python -m factory.cli analyze "$FACTORY_INSTRUCTION"
          else
            python -m factory.cli bible-plan
          fi

      - name: Apply project resolution
        env:
          FACTORY_INSTRUCTION: ${{ inputs.instruction }}
        run: |
          if [ -n "$FACTORY_INSTRUCTION" ]; then
            python main.py --instruction "$FACTORY_INSTRUCTION" --apply
          else
            bible=$(find game_bible/inbox -maxdepth 1 -type f \( -name '*.docx' -o -name '*.md' -o -name '*.txt' \) | sort | tail -n 1)
            test -n "$bible"
            python main.py --bible "$bible" --apply
          fi

      - name: Evaluate release compliance
        run: python -m factory.cli compliance-check

      - name: Persist generated changes with Git
        run: |
          git config user.name "Game-Factory-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "factory: apply game bible request"
          git push origin HEAD:main

      - name: Final repository validation
        run: python -m factory.validate
