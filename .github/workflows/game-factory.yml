name: The Game Factory

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'Optional override/update instruction. Leave empty to use the newest Game Bible in game_bible/inbox.'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'game_bible/**'
      - 'factory/**'
      - 'agents/**'
      - 'projects/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: game-factory-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate repository
        run: python -m factory.validate

      - name: Check current stable Godot release
        run: python -m factory.cli engine-check

      - name: Inspect Game Bible when present
        shell: bash
        run: |
          bible_count=$(find game_bible/inbox -maxdepth 1 -type f \( -name '*.docx' -o -name '*.md' -o -name '*.txt' \) | wc -l)
          if [ "$bible_count" -gt 0 ]; then
            python -m factory.cli bible-plan
          else
            echo "No active Game Bible in inbox; repository validation continues."
          fi

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security tooling
        run: python -m pip install pip-audit bandit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -r factory main.py -ll

  godot-qa:
    needs: [validate, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y unzip curl
      - name: Resolve pinned engine
        id: engine
        shell: bash
        run: |
          version=$(awk '$1 == "version:" {print $2; exit}' projects/GME-2026-0002/engine.lock)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download pinned Godot editor
        env:
          GODOT_VERSION: ${{ steps.engine.outputs.version }}
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Headless project import validation
        env:
          GODOT_VERSION: ${{ steps.engine.outputs.version }}
        run: |
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless \
            --path projects/GME-2026-0002/godot \
            --editor \
            --quit
      - name: Run game smoke test
        env:
          GODOT_VERSION: ${{ steps.engine.outputs.version }}
        run: |
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless \
            --path projects/GME-2026-0002/godot \
            --script res://tests/smoke_test.gd

  build:
    needs: [validate, security, godot-qa]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve request
        env:
          FACTORY_INSTRUCTION: ${{ inputs.instruction }}
        run: |
          if [ -n "$FACTORY_INSTRUCTION" ]; then
            python -m factory.cli analyze "$FACTORY_INSTRUCTION"
          else
            python -m factory.cli bible-plan
          fi

      - name: Apply project resolution
        env:
          FACTORY_INSTRUCTION: ${{ inputs.instruction }}
        run: |
          if [ -n "$FACTORY_INSTRUCTION" ]; then
            python main.py --instruction "$FACTORY_INSTRUCTION" --apply
          else
            bible=$(find game_bible/inbox -maxdepth 1 -type f \( -name '*.docx' -o -name '*.md' -o -name '*.txt' \) | sort | tail -n 1)
            test -n "$bible"
            python main.py --bible "$bible" --apply
          fi

      - name: Evaluate release compliance
        run: python -m factory.cli compliance-check

      - name: Persist generated changes with Git
        run: |
          git config user.name "Game-Factory-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "factory: apply game bible request"
          git push origin HEAD:main

      - name: Final repository validation
        run: python -m factory.validate
