name: The Game Factory

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'New game request or project update instruction'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'game_bible/**'
      - 'factory/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: game-factory-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate repository
        run: python -m factory.validate

      - name: Run project registry smoke test
        run: python main.py --instruction "CI smoke test"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security tools
        run: python -m pip install pip-audit bandit
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -r factory main.py -ll

  build:
    needs: [validate, security]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Analyze request
        env:
          FACTORY_INSTRUCTION: ${{ inputs.instruction }}
        run: python -m factory.cli analyze "$FACTORY_INSTRUCTION"

      - name: Apply project registry/scaffold changes
        env:
          FACTORY_INSTRUCTION: ${{ inputs.instruction }}
        run: python main.py --instruction "$FACTORY_INSTRUCTION" --apply

      - name: Persist generated changes with Git
        run: |
          git config user.name "Game-Factory-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "factory: apply project request"
          git push origin HEAD:main

      - name: Final repository validation
        run: python -m factory.validate
