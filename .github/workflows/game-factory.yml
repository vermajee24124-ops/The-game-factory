name: The Game Factory

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'New game request or project update instruction'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'game_bible/**'
      - 'factory/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: game-factory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
      SUPPORT_GMAIL_ADDRESS: ${{ secrets.SUPPORT_GMAIL_ADDRESS }}
      SUPPORT_GMAIL_REFRESH_TOKEN: ${{ secrets.SUPPORT_GMAIL_REFRESH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate repository
        run: python -m factory.validate

      - name: Run project registry smoke test
        run: python main.py --instruction "CI smoke test"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security tools
        run: python -m pip install pip-audit bandit
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -r factory main.py -ll

  build:
    needs: [validate, security]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Analyze request
        env:
          FACTORY_INSTRUCTION: ${{ inputs.instruction }}
        run: python -m factory.cli analyze "$FACTORY_INSTRUCTION"
