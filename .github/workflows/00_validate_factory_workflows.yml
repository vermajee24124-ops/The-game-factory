name: Validate Factory Workflow YAML and Python

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "factory_builder/**"
      - "game_factory/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Parse every checked-in workflow and validate structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(Path(".github/workflows").glob("*.yml")) + sorted(Path(".github/workflows").glob("*.yaml"))
          if not files:
              raise SystemExit("No workflow YAML files found.")
          failed = []
          for path in files:
              try:
                  doc = yaml.safe_load(path.read_text(encoding="utf-8"))
                  if not isinstance(doc, dict):
                      raise ValueError("workflow root is not a mapping")
                  jobs = doc.get("jobs")
                  if not isinstance(jobs, dict) or not jobs:
                      raise ValueError("jobs must be a non-empty mapping")
                  for job_name, job in jobs.items():
                      if not isinstance(job, dict):
                          raise ValueError(f"job {job_name} is not a mapping")
                      if not isinstance(job.get("steps"), list):
                          raise ValueError(f"job {job_name} has no steps list")
                  print(f"YAML OK: {path}")
              except Exception as exc:
                  failed.append((str(path), str(exc)))
          if failed:
              for path, error in failed:
                  print(f"YAML ERROR: {path}: {error}")
              raise SystemExit(1)
          print(f"Validated {len(files)} workflow YAML files.")
          PY

      - name: Compile checked-in Python
        run: |
          set -euo pipefail
          python -m compileall -q factory_builder factory
          if [ -d game_factory ]; then python -m compileall -q game_factory; fi
          git diff --check
