name: Train FunctionGemma Godot Micro-Brain

on:
  workflow_dispatch:
    inputs:
      target_examples:
        description: 'Maximum distilled micro-task examples'
        required: false
        default: '12000'
  push:
    branches: [main]
    paths:
      - 'training/**'
      - 'local_brain/**'
      - '.github/workflows/train-functiongemma.yml'

permissions:
  contents: read

jobs:
  prepare-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_EXAMPLES: ${{ inputs.target_examples || '12000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distilled function-calling dataset
        run: python training/build_functiongemma_dataset.py
      - name: Upload dataset
        uses: actions/upload-artifact@v4
        with:
          name: functiongemma-dataset
          path: training/data/

  train:
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      FUNCTIONGEMMA_BASE_MODEL: google/functiongemma-270m-it
      FUNCTIONGEMMA_EPOCHS: '3'
      FUNCTIONGEMMA_LR: '0.00005'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Modal client
        run: python -m pip install modal huggingface_hub
      - uses: actions/download-artifact@v4
        with:
          name: functiongemma-dataset
          path: training/data/
      - name: Create or refresh Modal training volume and upload dataset
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess
          token_id=os.environ['MODAL_TOKEN_ID']
          token_secret=os.environ['MODAL_TOKEN_SECRET']
          subprocess.run(['modal','volume','create','game-factory-functiongemma','--yes'],check=False)
          subprocess.run(['modal','volume','put','game-factory-functiongemma','training/data/train.jsonl','/workspace/train.jsonl'],check=True)
          subprocess.run(['modal','volume','put','game-factory-functiongemma','training/data/eval.jsonl','/workspace/eval.jsonl'],check=True)
          PY
      - name: Launch GPU fine-tuning
        run: modal run modal/train_functiongemma.py
