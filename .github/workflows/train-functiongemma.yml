name: Train SmolLM2 Godot Micro-Brain

on:
  workflow_dispatch:
    inputs:
      target_examples:
        description: 'Maximum distilled micro-task examples'
        required: false
        default: '12000'
  push:
    branches: [main]
    paths:
      - 'training/bootstrap.trigger'

permissions:
  contents: read

concurrency:
  group: train-functiongemma
  cancel-in-progress: true

jobs:
  prepare-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_EXAMPLES: ${{ inputs.target_examples || '12000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distilled function-calling dataset
        run: python training/build_functiongemma_dataset.py
      - name: Validate dataset
        run: python training/validate_functiongemma_dataset.py
      - name: Upload dataset
        uses: actions/upload-artifact@v4
        with:
          name: smollm2-microbrain-dataset
          path: training/data/

  train:
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MICROBRAIN_BASE_MODEL: HuggingFaceTB/SmolLM2-360M-Instruct
      MICROBRAIN_EPOCHS: '1'
      MICROBRAIN_LR: '0.0001'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Modal client
        run: python -m pip install modal huggingface_hub
      - uses: actions/download-artifact@v4
        with:
          name: smollm2-microbrain-dataset
          path: training/data/
      - name: Create or refresh Modal training volume and upload dataset
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess
          subprocess.run(['modal','volume','create','game-factory-smollm2'],check=False)
          subprocess.run(['modal','volume','put','-f','game-factory-smollm2','training/data/train.jsonl','/workspace/train.jsonl'],check=True)
          subprocess.run(['modal','volume','put','-f','game-factory-smollm2','training/data/eval.jsonl','/workspace/eval.jsonl'],check=True)
          PY
      - name: Launch GPU fine-tuning
        run: modal run modal/train_functiongemma.py::train
      - name: Verify Modal training output
        run: modal volume ls game-factory-smollm2 /workspace/smollm2-godot-microbrain --json
