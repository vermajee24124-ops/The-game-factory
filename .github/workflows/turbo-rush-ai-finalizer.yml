name: Turbo Rush AI Finalizer

on:
  push:
    paths:
      - 'agent_stack/run_ai_finalizer.flag'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turbo-rush-ai-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CODECRAFT_API: ${{ secrets.CODECRAFT_API }}
      NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MAX_LEAD_ROUNDS: '30'
      MAX_REVIEW_CYCLES: '4'
      MAX_TOKENS_PER_CALL: '16000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl python3-pip
      - name: Install Godot 4.7.2
        run: |
          mkdir -p /tmp/godot
          curl -L --fail --retry 4 -o /tmp/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import before AI
        run: $GODOT_BIN --headless --path projects/GME-2026-0003/godot --editor --quit
      - name: Secret scan
        run: |
          ! grep -RInE '(sk-[A-Za-z0-9_-]{20,}|cc_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' --exclude-dir=.git --exclude='*.jsonl' .
      - name: Run AI engineering loop
        run: |
          python3 -m pip install --user requests
          python3 agent_stack/turbo_rush_ai_finalizer.py
      - name: Final Godot import
        run: $GODOT_BIN --headless --path projects/GME-2026-0003/godot --editor --quit
      - name: Final smoke test
        run: $GODOT_BIN --headless --path projects/GME-2026-0003/godot --script res://tests/smoke_test.gd
      - name: Diff check
        run: git diff --check
      - name: Commit AI changes
        run: |
          git config user.name 'Turbo Rush AI Finalizer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/GME-2026-0003 agent_stack/reports/latest.json
          if git diff --cached --quiet; then echo 'No tracked changes to commit.'; exit 0; fi
          git commit -m 'ai: finalize Turbo Rush release candidate'
          git push origin HEAD:main
      - name: Upload AI report
        uses: actions/upload-artifact@v4
        with:
          name: turbo-rush-ai-finalizer-report
          path: agent_stack/reports/latest.json
          if-no-files-found: error