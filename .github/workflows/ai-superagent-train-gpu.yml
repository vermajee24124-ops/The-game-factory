name: AI SuperAgent GPU Training

on:
  workflow_dispatch:
    inputs:
      base_model:
        description: 'Hugging Face model ID'
        required: true
        default: 'Qwen/Qwen3-8B'
      epochs:
        description: 'Training epochs'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  train:
    if: ${{ vars.SUPERAGENT_GPU_RUNNER == 'true' }}
    runs-on: [self-hosted, gpu]
    timeout-minutes: 330
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      BASE_MODEL: ${{ inputs.base_model }}
      EPOCHS: ${{ inputs.epochs }}
    steps:
      - uses: actions/checkout@v4
      - name: Install training stack
        run: python -m pip install --upgrade pip transformers datasets peft accelerate trl
      - name: Check CUDA
        run: python -c "import torch; print(torch.cuda.is_available(), torch.cuda.device_count() if torch.cuda.is_available() else 0)"
      - name: Check dataset
        run: test -f build/ai_superagent/tool_use_trajectories.jsonl
      - name: Training hook
        run: |
          echo "Dataset is ready for model-specific SFT/LoRA."
          echo "BASE_MODEL=$BASE_MODEL"
          echo "EPOCHS=$EPOCHS"
          echo "Add the selected trainer implementation after the GPU runner and model license are confirmed."
